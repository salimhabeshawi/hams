name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
