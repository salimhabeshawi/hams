# Reuse task outputs across builds and clean runs
org.gradle.caching=true

# Enable parallel execution for multi-module setups
org.gradle.parallel=true

# Skip the heavy configuration phase on subsequent builds (Game changer)
org.gradle.configuration-cache=true

# Give the Gradle Daemon enough memory and modern garbage collection
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC