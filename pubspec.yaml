name: hams
description: "Offline voice communication over local Wi-Fi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  meta: ^1.18.3
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5
  pigeon: ^29.1.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/blocklist.txt

flutter_launcher_icons:
  android: true
  image_path: assets/icon/hams_icon.png
  adaptive_icon_background: "#4285F4"
  adaptive_icon_foreground: assets/icon/hams_icon_foreground.png

flutter_native_splash:
  color: "#4285F4"
  android_12:
    color: "#4285F4"
